name: Release

# Automatically builds, signs, and publishes a GitHub Release (with an
# installable APK) whenever a version tag (e.g. "v1.2.0") is pushed.
#
# One-time setup required (see RELEASE.md):
#   Add these repository secrets (Settings → Secrets and variables → Actions):
#     RELEASE_KEYSTORE_BASE64   – base64-encoded GitHub-release keystore (.jks)
#     RELEASE_STORE_PASSWORD     – keystore store password
#     RELEASE_KEY_ALIAS          – key alias inside the keystore
#     RELEASE_KEY_PASSWORD       – key password
#
# This uses a DEDICATED GitHub-release keystore (not your Play upload key),
# so your Play signing key never touches CI.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write signing config from secrets
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "storeFile=${{ github.workspace }}/release.keystore" > keystore.properties
          echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> keystore.properties

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare release artifact
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" "Linkzary-${GITHUB_REF_NAME}.apk"
          ls -lh "Linkzary-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release & upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: Linkzary-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
