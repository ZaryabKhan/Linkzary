name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Print debug APK signing fingerprint (for GCP OAuth client)
        run: |
          keytool -list -v -keystore keystores/debug.keystore -alias androiddebugkey -storepass android -storetype PKCS12 | grep -E "SHA1:|SHA256:"

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signed-release-apk:
    # Signed RELEASE-variant APK for the GitHub release channel (user decision
    # 2026-11-15): R8 release build signed with the committed debug keystore so
    # the cert SHA-1 matches the pinned 6721D2A4… fingerprint — the signature
    # every user-installed build carries, so the GitHub APK updates in place.
    # (release keystore secrets are intentionally NOT used here; the Play
    # upload key never touches CI per RELEASE.md.)
    name: Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build unsigned release APK (R8, no local keystore.properties on CI)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Sign release APK with the committed pinned-cert keystore
        run: |
          UNSIGNED=$(find app/build/outputs/apk/release -name '*-unsigned.apk' -o -name '*.apk' | head -1)
          echo "unsigned: $UNSIGNED"
          APKSIGNER=$ANDROID_HOME/build-tools/36.0.0/apksigner
          ZIPALIGN=$ANDROID_HOME/build-tools/36.0.0/zipalign
          $ZIPALIGN -f -P 16 4096 "$UNSIGNED" app-release-aligned.apk
          $APKSIGNER sign \
            --ks keystores/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app-release-signed.apk app-release-aligned.apk
          $APKSIGNER verify --print-certs app-release-signed.apk

      - name: Assert signing cert matches the pinned SHA-1
        run: |
          APKSIGNER=$ANDROID_HOME/build-tools/36.0.0/apksigner
          CERT=$($APKSIGNER verify --print-certs app-release-signed.apk \
            | grep "certificate SHA-1 digest" \
            | grep -ioE "[0-9a-f]{40}" | tr 'a-f' 'A-F')
          echo "cert: $CERT"
          if [ "$CERT" != "6721D2A4634EFA3973643CE23DD4A5C291026DE8" ]; then
            echo "::error::Signing cert $CERT does not match the pinned 6721D2A4634EFA3973643CE23DD4A5C291026DE8"
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app-release-signed.apk
          if-no-files-found: error

  signed-release-aab:
    # Signed RELEASE-variant App Bundle for the Play Console upload (Console
    # request 2026-11-15): R8 bundleRelease, unsigned on CI (no local
    # keystore.properties), then JAR-signed with the committed pinned-cert
    # keystore — the only key that matches the pinned 6721D2A4… SHA-1. AABs
    # are signed with jarsigner (v1), not apksigner.
    name: Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build unsigned release bundle (R8)
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Sign release AAB with the committed pinned-cert keystore
        run: |
          UNSIGNED=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "unsigned bundle: $UNSIGNED"
          cp "$UNSIGNED" app-release.aab
          jarsigner -keystore keystores/debug.keystore \
            -storepass android -keypass android \
            -sigalg SHA256WITHRSA -digestalg SHA-256 \
            app-release.aab androiddebugkey
          jarsigner -verify -verbose:summary app-release.aab

      - name: Assert signing cert matches the pinned SHA-1
        run: |
          CERT=$(keytool -printcert -jarfile app-release.aab \
            | grep "SHA1:" | head -1 | grep -ioE "[0-9a-f]{40}" | tr 'a-f' 'A-F')
          echo "cert: $CERT"
          if [ "$CERT" != "6721D2A4634EFA3973643CE23DD4A5C291026DE8" ]; then
            echo "::error::Signing cert $CERT does not match the pinned 6721D2A4634EFA3973643CE23DD4A5C291026DE8"
            exit 1
          fi

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-aab
          path: app-release.aab
          if-no-files-found: error
