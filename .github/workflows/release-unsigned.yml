name: Unsigned Release Artifacts

# Manual build of UNSIGNED release bundle + APK for v1.2.0 (a76f957).
# Signing happens locally (jarsigner/apksigner with the real keystores,
# which never touch CI). Build-only per standing order — no local Gradle.
on:
  push:
    branches: [ "release-v120-unsigned" ]

jobs:
  unsigned-release:
    name: Unsigned Release Bundle + APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1.2.0
        uses: actions/checkout@v4
        with:
          ref: a76f957de007cb8b4a43ca7fbd810786edec572c

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Confirm checkout is at a76f957 (v1.2.0)
        run: |
          SHA=$(git rev-parse HEAD)
          echo "HEAD=$SHA"
          if [ "$SHA" != "a76f957de007cb8b4a43ca7fbd810786edec572c" ]; then
            echo "::error::Checkout is not the v1.2.0 release commit a76f957"
            exit 1
          fi

      - name: Build unsigned release bundle (R8)
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Build unsigned release APK (R8)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
